<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway Jurnal KBM - SMAN 2 Karanganyar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-blue-950 via-slate-900 to-indigo-950 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">

    <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-6 text-center space-y-5 border-4 border-yellow-400">
        <!-- LOGO & HEADER -->
        <img src="https://lh3.googleusercontent.com/d/1YQYf0kgtLInAzpSJKJ_3Da86dIoVXU6n" 
             onError="this.onerror=null;this.src='https://placehold.co/100x100/003366/ffffff?text=SMADA'" 
             class="w-16 h-16 mx-auto object-contain drop-shadow" alt="Logo Sekolah">
        
        <div>
            <h1 class="text-lg font-black text-slate-900 tracking-wide">SMAN 2 KARANGANYAR</h1>
            <p class="text-xs text-blue-900 font-bold bg-blue-100 py-1 px-3 rounded-full inline-block mt-1">Sistem Jurnal Mengajar Guru</p>
        </div>

        <!-- STATUS PROSES OTENTIKASI -->
        <div id="statusBox" class="p-4 rounded-2xl bg-slate-50 border-2 border-slate-200 space-y-2">
            <div id="statusIcon" class="text-3xl text-blue-900">
                <i class="fa-solid fa-spinner fa-spin"></i>
            </div>
            <p id="statusMessage" class="text-xs font-black text-slate-700">Memeriksa Sesi SSO...</p>
        </div>

        <!-- TOMBOL KEMBALI KE PORTAL UTAMA (TAMPIL JIKA BELUM LOGIN) -->
        <div id="actionArea" class="hidden space-y-2 pt-1">
            <a href="https://yhanedy.github.io/presensi-smandakra/" class="w-full py-3 bg-yellow-400 hover:bg-yellow-500 text-blue-950 font-black rounded-xl text-xs shadow-lg transition flex items-center justify-center gap-2 border-2 border-yellow-500 block">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>LOGIN VIA PORTAL SSO PRESENSI</span>
            </a>
        </div>

        <div class="text-[10px] text-slate-400 font-bold pt-1">
            <p>&copy; yhanedy@2026 SMAN 2 Karanganyar.</p>
        </div>
    </div>

    <!-- SCRIPT OTOMATIS GATEKEEPER SSO -->
    <script>
        const PORTAL_SSO_URL = "https://yhanedy.github.io/presensi-smandakra/";

        window.onload = function() {
            prosesOtentikasiSSO();
        };

        function prosesOtentikasiSSO() {
            const urlParams = new URLSearchParams(window.location.search);
            const ssoToken = urlParams.get('sso_token');
            const statusMessage = document.getElementById('statusMessage');
            const statusIcon = document.getElementById('statusIcon');
            const actionArea = document.getElementById('actionArea');

            // 1. JIKA DIAKSES DARI KOTAK JURNAL DENGAN MEMBAWA TOKEN SSO
            if (ssoToken) {
                try {
                    const decodedData = JSON.parse(atob(decodeURIComponent(ssoToken)));
                    
                    // Simpan sesi SSO ke LocalStorage lokal jurnalmengajar
                    localStorage.setItem('smada_user', JSON.stringify(decodedData));
                    
                    statusIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i>`;
                    statusMessage.innerText = "Sesi Ditemukan! Membuka Jurnal Mengajar...";

                    // Langsung alihkan ke halaman jurnal tanpa form login
                    setTimeout(() => {
                        arahkanKeJurnal(decodedData);
                    }, 500);
                    return;
                } catch (e) {
                    console.error("Format token SSO tidak valid:", e);
                }
            }

            // 2. JIKA SUDAH PERNAH LOGIN SEBELUMNYA (ADA SESI TERSIMPAN)
            const rawUser = localStorage.getItem('smada_user');
            if (rawUser && rawUser !== "null" && rawUser !== "undefined") {
                try {
                    const user = JSON.parse(rawUser);
                    statusIcon.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600"></i>`;
                    statusMessage.innerText = `Selamat Datang, ${user.nama || user.username}!`;

                    setTimeout(() => {
                        arahkanKeJurnal(user);
                    }, 500);
                    return;
                } catch (e) {
                    localStorage.removeItem('smada_user');
                }
            }

            // 3. JIKA BELUM LOGIN SAMA SEKALI
            statusIcon.innerHTML = `<i class="fa-solid fa-lock text-amber-500"></i>`;
            statusMessage.innerText = "Akses Terbatas! Silakan login melalui Portal SSO Presensi.";
            actionArea.classList.remove('hidden');

            // Otomatis kembalikan ke Portal Utama Presensi setelah 2 detik
            setTimeout(() => {
                window.location.replace(PORTAL_SSO_URL);
            }, 2000);
        }

        function arahkanKeJurnal(user) {
            const r = String(user.role || '').toLowerCase();
            if (r.includes('admin') || r.includes('superadmin') || r.includes('super_admin') || r.includes('jurnal')) {
                window.location.replace('admin-jurnal.html');
            } else {
                window.location.replace('jurnal.html');
            }
        }
    </script>
</body>
</html>
