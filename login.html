<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - SMAN 2 Karanganyar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 border border-slate-200">
        <!-- Logo Header -->
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-900 text-yellow-400 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg">
                <i class="fa-solid fa-user-shield text-3xl"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-800">LOGIN ADMIN KBM</h1>
            <p class="text-xs text-slate-500 mt-1">SMAN 2 Karanganyar</p>
        </div>

        <!-- Alert Error -->
        <div id="loginAlert" class="hidden mb-4 p-3 rounded-xl bg-red-100 text-red-700 text-xs font-semibold"></div>
        <!-- Ubah type="email" menjadi type="text" -->
<input type="text" id="email" required placeholder="admin / NIP / Email" class="w-full pl-9 pr-3 py-2.5 border rounded-xl focus:ring-2 focus:ring-blue-600 text-sm">

        <!-- Form Login -->
        <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Email / NIP Admin</label>
                <div class="relative">
                    <i class="fa-solid fa-envelope absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <input type="email" id="email" required placeholder="admin@sman2kra.sch.id" class="w-full pl-9 pr-3 py-2.5 border rounded-xl focus:ring-2 focus:ring-blue-600 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400 text-sm"></i>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-9 pr-3 py-2.5 border rounded-xl focus:ring-2 focus:ring-blue-600 text-sm">
                </div>
            </div>

            <button type="submit" id="btnLogin" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm flex items-center justify-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i> MASUK KE DASHBOARD
            </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-100 pt-4">
            <a href="index.html" class="text-xs text-slate-500 hover:text-blue-600">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Form Jurnal Guru
            </a>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('loginAlert');
            const btn = document.getElementById('btnLogin');

            alertBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Memeriksa Akun...';

            try {
                // 1. Authenticate via Supabase Auth (SSO)
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // 2. Cek Role User di Tabel 'user'
                const { data: userData, error: userErr } = await supabaseClient
                    .from('user')
                    .select('role')
                    .eq('email', email)
                    .single();

                if (userErr || !userData || userData.role !== 'admin') {
                    await supabaseClient.auth.signOut();
                    throw new Error("Akses Ditolak: Akun Anda bukan Administrator!");
                }

                // 3. Simpan Session & Redirect ke Admin Dashboard
                alert("Login Berhasil!");
                window.location.href = "admin.html";

            } catch (err) {
                alertBox.innerText = err.message || "Gagal Login. Periksa Email & Password.";
                alertBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> MASUK KE DASHBOARD';
            }
        }
    </script>
</body>
</html>
